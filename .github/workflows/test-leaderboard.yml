name: Test leaderboard changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and leaderboard JavaScript
        run: |
          test -f index.html
          test -f leaderboard.js
          grep -q "leaderboard" index.html
          node --check leaderboard.js
      - name: Verify score persistence and deduplication implementation
        run: |
          grep -q "gamehub_pending_scores" leaderboard.js
          grep -q "game_scores" leaderboard.js
          grep -q "window.saveGameHubScore=queueScore" leaderboard.js
          grep -q "function installScoreHook" leaderboard.js
          grep -q "const best=new Map()" leaderboard.js
          grep -q "const hookTimer=setInterval" leaderboard.js
          grep -q "const i=list.findIndex" leaderboard.js
          grep -q "existing.length>1" leaderboard.js
      - name: Verify per-game leaderboard definitions
        run: |
          for game in sudoku_easy sudoku_medium sudoku_hard mines_easy mines_medium mines_hard 2048 snake tic_tac_toe connect_four breakout simon_says block_blast wordle tag cookie_clicker; do
            grep -q "$game" leaderboard.js
          done
