name: Test leaderboard changes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and leaderboard JavaScript
        run: |
          test -f index.html
          test -f leaderboard.js
          grep -q "leaderboard" index.html
          node --check leaderboard.js
      - name: Verify score persistence, deduplication, and score direction
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('leaderboard.js','utf8');
          const required=[
            /gamehub_pending_scores/,
            /game_scores/,
            /window\.saveGameHubScore\s*=\s*queueScore/,
            /function installScoreHook/,
            /best\s*=\s*new Map\(\)/,
            /const hookTimer\s*=\s*setInterval/,
            /findIndex\(x=>x\.account_code===item\.account_code&&x\.game_id===item\.game_id\)/,
            /if\(existing\.length\)/,
            /higherIsBetter/,
            /mines_easy.*mines_medium.*mines_hard/s,
            /snake_slow.*snake_medium.*snake_fast.*snake_extreme/s,
            /window\.__GAMEHUB_LEADERBOARD_LOADED/
          ];
          for(const pattern of required){
            if(!pattern.test(s)) throw new Error('Missing leaderboard requirement: '+pattern);
          }
          if(/new MutationObserver/.test(s)) throw new Error('MutationObserver regression detected');
          console.log('Leaderboard implementation checks passed');
          NODE
      - name: Verify every configured game leaderboard
        run: |
          for game in sudoku_easy sudoku_medium sudoku_hard sudoku_extra mines_easy mines_medium mines_hard memory tic_tac_toe snake_slow snake_medium snake_fast snake_extreme 2048 connect_four whack_a_mole simon_says tag cookie_clicker pong breakout reaction_test top_down_racing tetris air_hockey coin_rush detective climb dodge gravity_switch 15_puzzle ninja_run basket_random crossy_road bitlife paper_io snake_io subaway_runners super_mario block_blast wordle; do
            grep -q "$game" leaderboard.js
          done
      - name: Verify extra game modules and bug fixes
        run: |
          for file in games/racing.js games/tetris.js games/airhockey.js games/coinrush.js games/detective.js games/climb.js games/dodge.js games/gravity.js games/puzzle15.js games/ninja.js games/basket.js games/crossy.js games/bitlife.js games/paperio.js games/snakeio.js games/mario.js games/subaway.js games/extra-loader.js games/ui-fixes.js; do
            test -f "$file"
            node --check "$file"
          done
          for game in racing tetris airhockey coinrush detective climb dodge gravity puzzle15 ninja basket crossy bitlife paperio snakeio mario subaway; do
            grep -q "'$game'" games/extra-loader.js
          done
          grep -q 'cookie-reset-fix' games/ui-fixes.js
          grep -q 'safeBotSpawn' games/snakeio.js
          grep -q 'angleTravel' games/racing.js
          grep -q 'jumpPow=650' games/basket.js
          grep -q 'Science Club' games/bitlife.js
