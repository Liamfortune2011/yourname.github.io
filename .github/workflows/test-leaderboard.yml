name: Test leaderboard changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and leaderboard JavaScript
        run: |
          test -f index.html
          test -f leaderboard.js
          grep -q "leaderboard" index.html
          node --check leaderboard.js
      - name: Verify score persistence and deduplication implementation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('leaderboard.js','utf8');
          const required=[
            /gamehub_pending_scores/,
            /game_scores/,
            /window\.saveGameHubScore\s*=\s*queueScore/,
            /function installScoreHook/,
            /const best=new Map\(\)/,
            /const hookTimer=setInterval/,
            /findIndex\(x=>x\.account_code===item\.account_code&&x\.game_id===item\.game_id\)/,
            /if\(existing\.length\)/,
            /window\.__GAMEHUB_LEADERBOARD_LOADED/
          ];
          for(const pattern of required){
            if(!pattern.test(s)) throw new Error('Missing leaderboard requirement: '+pattern);
          }
          if(/new MutationObserver/.test(s)) throw new Error('MutationObserver regression detected');
          console.log('Leaderboard implementation checks passed');
          NODE
      - name: Verify per-game leaderboard definitions
        run: |
          for game in sudoku_easy sudoku_medium sudoku_hard mines_easy mines_medium mines_hard 2048 snake tic_tac_toe connect_four breakout simon_says block_blast wordle tag cookie_clicker; do
            grep -q "$game" leaderboard.js
          done
      - name: Verify extra game modules
        run: |
          for file in games/racing.js games/tetris.js games/airhockey.js games/coinrush.js games/detective.js games/climb.js games/dodge.js games/gravity.js games/puzzle15.js games/extra-loader.js; do
            test -f "$file"
            node --check "$file"
          done
          grep -q '"id":"dodge"' games/extra-loader.js
          grep -q '"id":"gravity"' games/extra-loader.js
          grep -q '"id":"puzzle15"' games/extra-loader.js
