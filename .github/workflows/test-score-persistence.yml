name: Test score persistence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check leaderboard.js
      - name: Verify score queue and Supabase write
        run: |
          grep -q "gamehub_pending_scores" leaderboard.js
          grep -q "game_scores" leaderboard.js
          grep -q "window.saveGameHubScore=queueScore" leaderboard.js
          grep -q "function installScoreHook" leaderboard.js
          grep -q "async function flushScores" leaderboard.js
          grep -q "async function saveOne" leaderboard.js
          grep -q "method:'POST'" leaderboard.js
          grep -q "method:'PATCH'" leaderboard.js
          grep -q "method:'DELETE'" leaderboard.js
          grep -q "const i=list.findIndex" leaderboard.js
          grep -q "window.__GAMEHUB_LEADERBOARD_LOADED" leaderboard.js
          ! grep -q "new MutationObserver" leaderboard.js
