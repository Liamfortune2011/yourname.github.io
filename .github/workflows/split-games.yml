name: Validate game modules

on:
  push:
    branches:
      - refactor/games-into-files
  pull_request:
    types: [synchronize]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'refactor/games-into-files'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/games-into-files
          fetch-depth: 1

      - name: Validate generated game files
        run: |
          set -e
          test -d games
          count=$(find games -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "Found $count game files"
          test "$count" -ge 13
          for f in games/*.js; do
            test -s "$f"
            node --check "$f"
          done
          grep -q 'games/sudoku.js' index.html
          grep -q 'games/cookie-clicker.js' index.html
          test -f games/tetris.js
          echo "Game module validation passed"
