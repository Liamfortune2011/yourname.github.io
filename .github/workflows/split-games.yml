name: Split games into modules

on:
  push:
    branches:
      - refactor/games-into-files
  pull_request:
    types: [synchronize]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'refactor/games-into-files'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/games-into-files
          fetch-depth: 0

      - name: Split game sections
        run: python tools/split_games.py

      - name: Validate generated game files
        run: |
          set -e
          test -d games
          count=$(find games -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "Generated $count game files"
          test "$count" -ge 2
          for f in games/*.js; do
            # These files intentionally contain the original HTML + JS game sections,
            # so Node syntax-checking the whole file is invalid. Verify they are non-empty.
            test -s "$f"
          done

      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Split game sections into separate files"
          git push origin HEAD:${GITHUB_REF_NAME}
